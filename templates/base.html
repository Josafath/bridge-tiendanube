{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>{% block title %}Company Operations Center{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- 1. Inline Theme Mode Setter (Prevents screen flicker on load) -->
    <script>
        var defaultThemeMode = "light";
        var themeMode;
        if (document.documentElement) {
            if (document.documentElement.hasAttribute("data-bs-theme-mode")) {
                themeMode = document.documentElement.getAttribute("data-bs-theme-mode");
            } else {
                if (localStorage.getItem("data-bs-theme") !== null) {
                    themeMode = localStorage.getItem("data-bs-theme");
                } else {
                    themeMode = defaultThemeMode;
                }
            }
            if (themeMode === "system") {
                themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-bs-theme", themeMode);
        }
    </script>

    <!-- Saul Fonts & Global Stylesheets -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />
    <link rel="stylesheet" href="{% static 'plugins/global/plugins.bundle.css' %}" type="text/css" />
    <link rel="stylesheet" href="{% static 'css/style.bundle.css' %}" type="text/css" />

    {% block extra_css %}{% endblock %}
</head>

<body id="kt_app_body" 
      data-kt-app-layout="lightsidebar" 
      data-kt-app-header-fixed="true" 
      data-kt-app-sidebar-enabled="true" 
      data-kt-app-sidebar-fixed="true" 
      class="app-default">
    
    <div class="d-flex flex-column flex-root app-root" id="kt_app_root">
        <div class="app-page flex-column flex-root" id="kt_app_page">
            
            <!-- Sidebar -->
            {% include 'includes/_sidebar.html' %}

            <div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
                
                <!-- Header -->
                {% include 'includes/_header.html' %}

                <div class="app-main flex-column flex-row-fluid" id="kt_app_main">
                    <div class="d-flex flex-column flex-column-fluid">
                        <div id="kt_app_content" class="app-content flex-column-fluid">
                            <div id="kt_app_content_container" class="app-container container-fluid">
                                {% block content %}{% endblock %}
                            </div>
                        </div>
                    </div>

                    <!-- Footer -->
                    {% include 'includes/_footer.html' %}
                </div>
            </div>
        </div>
    </div>

    <!-- Core Theme Scripts -->
    <script src="{% static 'plugins/global/plugins.bundle.js' %}"></script>
    <script src="{% static 'js/scripts.bundle.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
