{% load static %}
<!--begin::Sidebar-->
<div id="kt_app_sidebar" class="app-sidebar flex-column" data-kt-drawer="true" data-kt-drawer-name="app-sidebar" data-kt-drawer-activate="{default: true, lg: false}" data-kt-drawer-overlay="true" data-kt-drawer-width="225px" data-kt-drawer-direction="start" data-kt-drawer-toggle="#kt_app_sidebar_mobile_toggle">
	<!--begin::Logo-->
	<div class="app-sidebar-logo px-6" id="kt_app_sidebar_logo">
		<!--begin::Logo image-->
		<a href="{% url 'dashboard:index' %}">
			<img alt="Logo" src="{% static 'media/logos/default.svg' %}" class="h-30px app-sidebar-logo-default" />
		</a>
		<!--end::Logo image-->
		
		<!--begin::Sidebar toggle-->
		<div id="kt_app_sidebar_toggle" class="app-sidebar-toggle btn btn-icon btn-shadow btn-sm btn-color-muted btn-active-color-primary body-bg h-30px w-30px position-absolute top-50 start-100 translate-middle rotate" data-kt-toggle="true" data-kt-toggle-state="active" data-kt-toggle-target="body" data-kt-toggle-name="app-sidebar-minimize">
			<i class="ki-duotone ki-double-left fs-2 rotate-180">
				<span class="path1"></span>
				<span class="path2"></span>
			</i>
		</div>
		<!--end::Sidebar toggle-->
	</div>
	<!--end::Logo-->

	<!--begin::sidebar menu-->
	<div class="app-sidebar-menu overflow-hidden flex-column-fluid">
		<!--begin::Menu wrapper-->
		<div id="kt_app_sidebar_menu_wrapper" class="app-sidebar-wrapper hover-scroll-overlay-y my-5" data-kt-scroll="true" data-kt-scroll-activate="true" data-kt-scroll-height="auto" data-kt-scroll-dependencies="#kt_app_sidebar_logo, #kt_app_sidebar_footer" data-kt-scroll-wrappers="#kt_app_sidebar_menu" data-kt-scroll-offset="5px" data-kt-scroll-save-state="true">
			<!--begin::Menu-->
			<div class="menu menu-column menu-rounded menu-sub-indented px-3" id="#kt_app_sidebar_menu" data-kt-menu="true" data-kt-menu-expand="false">
				
				<!--begin:Menu item - Dashboard-->
				<div class="menu-item">
					<a class="menu-link active" href="{% url 'dashboard:index' %}">
						<span class="menu-icon">
							<i class="ki-duotone ki-element-11 fs-2">
								<span class="path1"></span>
								<span class="path2"></span>
								<span class="path3"></span>
								<span class="path4"></span>
							</i>
						</span>
						<span class="menu-title">Dashboards</span>
					</a>
				</div>
				<!--end:Menu item-->

				<!--begin:Menu item - Heading-->
				<div class="menu-item pt-5">
					<div class="menu-content">
						<span class="menu-heading fw-bold text-uppercase fs-7">Reportes</span>
					</div>
				</div>
				<!--end:Menu item-->

				<!--begin:Menu item - Tienda Nube Dropdown-->
				<div data-kt-menu-trigger="click" class="menu-item menu-accordion">
					<span class="menu-link">
						<span class="menu-icon">
							<i class="ki-duotone ki-shopping-cart fs-2">
								<span class="path1"></span>
								<span class="path2"></span>
							</i>
						</span>
						<span class="menu-title">Ventas</span>
						<span class="menu-arrow"></span>
					</span>
					<div class="menu-sub menu-sub-accordion">
						<div class="menu-item">
							<a class="menu-link" href="#">
								<span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
								<span class="menu-title">Orders</span>
							</a>
						</div>
						<div class="menu-item">
							<a class="menu-link" href="#">
								<span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
								<span class="menu-title">Productos</span>
							</a>
						</div>
						<div class="menu-item">
							<a class="menu-link" href="#">
								<span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
								<span class="menu-title">Configuraciones</span>
							</a>
						</div>
					</div>
				</div>
				<!--end:Menu item-->

				<!--begin:Menu item - Heading-->
				<div class="menu-item pt-5">
					<div class="menu-content">
						<span class="menu-heading fw-bold text-uppercase fs-7">Management</span>
					</div>
				</div>
				<!--end:Menu item-->

				<!--begin:Menu item - Internal Inventory-->
				<div class="menu-item">
					<a class="menu-link" href="#">
						<span class="menu-icon">
							<i class="ki-duotone ki-abstract-26 fs-2">
								<span class="path1"></span>
								<span class="path2"></span>
							</i>
						</span>
						<span class="menu-title">Internal Catalog</span>
					</a>
				</div>
				<!--end:Menu item-->

				<!--begin:Menu item - System Logs-->
				<div class="menu-item">
					<a class="menu-link" href="#">
						<span class="menu-icon">
							<i class="ki-duotone ki-chart-line-star fs-2">
								<span class="path1"></span>
								<span class="path2"></span>
								<span class="path3"></span>
							</i>
						</span>
						<span class="menu-title">Webhook Logs</span>
					</a>
				</div>
				<!--end:Menu item-->

			</div>
			<!--end::Menu-->
		</div>
		<!--end::Menu wrapper-->
	</div>
	<!--end::sidebar menu-->

	<!--begin::Footer - Banner Illustration-->
	<div class="app-sidebar-footer flex-column-auto pt-2 pb-6 px-6" id="kt_app_sidebar_footer">
		<div class="d-flex flex-column text-center bg-light-primary rounded p-4">
			<img class="mx-auto h-150px h-lg-175px mb-4" src="{% static 'media/misc/saul-welcome.png' %}" alt="Welcome">
			<div class="mb-3">
				<span class="fs-6 fw-bold text-gray-800">Need Help?</span>
				<div class="fs-7 text-gray-600">Check Tienda Nube integration docs</div>
			</div>
			<a href="https://dev.tiendanube.com/" target="_blank" class="btn btn-sm btn-primary">API Reference</a>
		</div>
	</div>
	<!--end::Footer-->
</div>
<!--end::Sidebar-->
