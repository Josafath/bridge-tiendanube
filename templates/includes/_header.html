{% load static %}
<!--begin::Header-->
<div id="kt_app_header" class="app-header" data-kt-sticky="true" data-kt-sticky-activate="{default: true, lg: true}" data-kt-sticky-name="app-header-minimize" data-kt-sticky-offset="{default: '200px', lg: '200px'}" data-kt-sticky-animation="false">
	<!--begin::Header container-->
	<div class="app-container container-fluid d-flex align-items-stretch justify-content-between" id="kt_app_header_container">
		
		<!--begin::Sidebar mobile toggle-->
		<div class="d-flex align-items-center d-lg-none ms-n3 me-1 me-md-2" title="Show sidebar menu">
			<div class="btn btn-icon btn-active-color-primary w-35px h-35px" id="kt_app_sidebar_mobile_toggle">
				<i class="ki-duotone ki-abstract-14 fs-2 fs-md-1">
					<span class="path1"></span>
					<span class="path2"></span>
				</i>
			</div>
		</div>
		<!--end::Sidebar mobile toggle-->

		<!--begin::Mobile logo-->
		<div class="d-flex align-items-center flex-grow-1 flex-lg-grow-0">
			<a href="{% url 'dashboard:index' %}" class="d-lg-none">
				<img alt="Logo" src="{% static 'media/logos/default-small.svg' %}" class="h-30px" />
			</a>
		</div>
		<!--end::Mobile logo-->

		<!--begin::Header wrapper-->
		<div class="d-flex align-items-stretch justify-content-between flex-lg-grow-1" id="kt_app_header_wrapper">
			
			<!--begin::Menu wrapper / Page title placeholder-->
			<div class="app-header-menu app-header-mobile-drawer align-items-stretch" data-kt-drawer="true" data-kt-drawer-name="app-header-menu" data-kt-drawer-activate="{default: true, lg: false}" data-kt-drawer-overlay="true" data-kt-drawer-width="225px" data-kt-drawer-direction="end" data-kt-drawer-toggle="#kt_app_header_menu_toggle">
				<div class="d-flex align-items-center px-2">
					<span class="text-gray-800 fs-5 fw-bold d-none d-lg-inline-block">
						Reportes
					</span>
				</div>
			</div>
			<!--end::Menu wrapper-->

			<!--begin::Navbar-->
			<div class="app-navbar flex-shrink-0">
				
				<!--begin::Search-->
				<div class="app-navbar-item align-items-stretch ms-1 ms-md-3">
					<div id="kt_header_search" class="header-search d-flex align-items-stretch" data-kt-search-keypress="true" data-kt-search-min-length="2" data-kt-search-enter="enter" data-kt-search-layout="menu">
						<div data-kt-search-element="toggle" class="d-flex align-items-center" id="kt_header_search_toggle">
							<div class="btn btn-icon btn-custom btn-icon-muted btn-active-light btn-active-color-primary w-35px h-35px">
								<i class="ki-duotone ki-magnifier fs-2">
									<span class="path1"></span>
									<span class="path2"></span>
								</i>
							</div>
						</div>
					</div>
				</div>
				<!--end::Search-->

				<!--begin::Notifications-->
				<div class="app-navbar-item ms-1 ms-md-3">
					<div class="btn btn-icon btn-custom btn-icon-muted btn-active-light btn-active-color-primary w-35px h-35px" data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-attach="parent" data-kt-menu-placement="bottom-end">
						<i class="ki-duotone ki-notification-status fs-2">
							<span class="path1"></span>
							<span class="path2"></span>
							<span class="path3"></span>
							<span class="path4"></span>
						</i>
					</div>
				</div>
				<!--end::Notifications-->

				<div class="app-navbar-item ms-1 ms-md-3">
    <!--begin::Menu toggle-->
    <a href="#" class="btn btn-icon btn-custom btn-icon-muted btn-active-light btn-active-color-primary w-35px h-35px" 
       data-kt-menu-trigger="{default: 'click', lg: 'hover'}" 
       data-kt-menu-attach="parent" 
       data-kt-menu-placement="bottom-end">
        <i class="ki-duotone ki-night-day theme-light-show fs-2">
            <span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span><span class="path5"></span><span class="path6"></span><span class="path7"></span><span class="path8"></span><span class="path9"></span><span class="path10"></span>
        </i>
        <i class="ki-duotone ki-moon theme-dark-show fs-2">
            <span class="path1"></span><span class="path2"></span>
        </i>
    </a>
    <!--end::Menu toggle-->

    <!--begin::Menu-->
    <div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-title-gray-700 menu-icon-gray-500 menu-active-bg menu-state-color fw-semibold py-4 fs-base w-150px" data-kt-menu="true" data-kt-element="theme-mode-menu">
        <!--begin::Menu item - Light-->
        <div class="menu-item px-3 my-0">
            <a href="#" class="menu-link px-3 py-2" data-kt-element="mode" data-kt-value="light">
                <span class="menu-icon me-2" data-kt-element="icon">
                    <i class="ki-duotone ki-night-day fs-2">
                        <span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span><span class="path5"></span><span class="path6"></span><span class="path7"></span><span class="path8"></span><span class="path9"></span><span class="path10"></span>
                    </i>
                </span>
                <span class="menu-title">Light</span>
            </a>
        </div>
        <!--end::Menu item-->

        <!--begin::Menu item - Dark-->
        <div class="menu-item px-3 my-0">
            <a href="#" class="menu-link px-3 py-2" data-kt-element="mode" data-kt-value="dark">
                <span class="menu-icon me-2" data-kt-element="icon">
                    <i class="ki-duotone ki-moon fs-2">
                        <span class="path1"></span><span class="path2"></span>
                    </i>
                </span>
                <span class="menu-title">Dark</span>
            </a>
        </div>
        <!--end::Menu item-->

        <!--begin::Menu item - System-->
        <div class="menu-item px-3 my-0">
            <a href="#" class="menu-link px-3 py-2" data-kt-element="mode" data-kt-value="system">
                <span class="menu-icon me-2" data-kt-element="icon">
                    <i class="ki-duotone ki-screen fs-2">
                        <span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span>
                    </i>
                </span>
                <span class="menu-title">System</span>
            </a>
        </div>
        <!--end::Menu item-->
    </div>
    <!--end::Menu-->
</div>
<!--end::Theme mode switcher-->

				<!--begin::User menu-->
				<div class="app-navbar-item ms-1 ms-md-3" id="kt_header_user_menu_toggle">
					<!--begin::Menu wrapper-->
					<div class="cursor-pointer symbol symbol-35px" data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-attach="parent" data-kt-menu-placement="bottom-end">
						<img src="{% static 'media/avatars/300-1.jpg' %}" alt="user" />
					</div>
					
					<!--begin::User account menu-->
					<div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-800 menu-state-bg menu-state-color fw-semibold py-4 fs-6 w-275px" data-kt-menu="true">
						<!--begin::Menu item-->
						```html
						<div class="menu-item px-3 font-semibold">
							<div class="menu-content d-flex align-items-center px-3">
								<!--begin::Avatar-->
								<div class="symbol symbol-50px me-5">
									<img alt="Logo" src="{% static 'media/avatars/300-1.jpg' %}" />
								</div>
								<!--end::Avatar-->

								<!--begin::Username-->
								<div class="d-flex flex-column">
									<div class="fw-bold d-flex align-items-center fs-5">
										{{ request.user.get_full_name|default:request.user.username }}
										<span class="badge badge-light-success fw-bold fs-8 px-2 py-1 ms-2">Admin</span>
									</div>
									<a href="#" class="fw-semibold text-muted text-hover-primary fs-7">
										{{ request.user.email|default:"admin@company.com" }}
									</a>
								</div>
								<!--end::Username-->
							</div>
						</div>
						<!--end::Menu item-->

						<div class="separator my-2"></div>

						<!--begin::Menu item-->
						<div class="menu-item px-5">
							<a href="#" class="menu-link px-5">My Profile</a>
						</div>
						<!--end::Menu item-->

						<!--begin::Menu item-->
						<div class="menu-item px-5">
							<a href="#" class="menu-link px-5">
								<span class="menu-text">Store Settings</span>
								<span class="menu-badge">
									<span class="badge badge-light-danger badge-circle fw-bold fs-7">3</span>
								</span>
							</a>
						</div>
						<!--end::Menu item-->

						<div class="separator my-2"></div>

						<!--begin::Menu item-->
						<div class="menu-item px-5">
							<form method="post" action="{% url 'admin:logout' %}">
								{% csrf_token %}
								<button type="submit" class="dropdown-item menu-link px-5 w-100 text-start bg-transparent border-0 text-gray-800">
									Sign Out
								</button>
							</form>
						</div>
						<!--end::Menu item-->
					</div>
					<!--end::User account menu-->
				</div>
				<!--end::User menu-->

			</div>
			<!--end::Navbar-->
		</div>
		<!--end::Header wrapper-->
	</div>
	<!--end::Header container-->
</div>
<!--end::Header-->
